# fly.toml — Fly.io configuration for LeadTube Hub
# See https://fly.io/docs/reference/configuration/

app = 'leadtube-hub'
primary_region = 'bom'  # Mumbai, closest to India

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'
  DB_PATH = '/data/mailblast.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'leadtube_data'
  destination = '/data'
