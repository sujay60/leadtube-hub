# fly.toml — Fly.io configuration for MailBlast
# See https://fly.io/docs/reference/configuration/

app = 'mailblast'
primary_region = 'bom'  # Mumbai, closest to India

[build]

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  DB_PATH = '/data/mailblast.db'
  BASE_URL = 'https://mailblast.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'mailblast_data'
  destination = '/data'
